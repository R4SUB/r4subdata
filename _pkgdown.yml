url: https://r4sub.github.io/r4subdata/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#2C6DB5"

navbar:
  bg: light
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/R4SUB/r4subdata
      aria-label: GitHub

home:
  title: "r4subdata: Example Datasets for R4SUB"

reference:
  - title: "Dataset Index"
    contents:
      - list_datasets
      - dataset_dictionary
  - title: "Pharma Study Datasets"
    contents:
      - evidence_pharma
      - adam_metadata
      - sdtm_metadata
      - trace_mapping
      - risk_register_pharma
      - regulatory_indicators
  - title: "Oncology Trial Datasets"
    contents:
      - oncology_metadata
      - oncology_evidence
      - risk_register_oncology
      - sdtm_metadata_oncology
      - trace_mapping_oncology
  - title: "CNS Trial Datasets"
    contents:
      - cns_metadata
      - cns_evidence
      - sdtm_metadata_cns
      - trace_mapping_cns
      - risk_register_cns
  - title: "Validation"
    contents:
      - validate_dataset

footer:
  structure:
    left: developed_by
    right: built_with
